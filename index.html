<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Мій гарний сайт</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            color: #333;
        }
        header {
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        nav {
            background: #333;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        nav a:hover {
            color: #74ebd5;
        }
        main {
            padding: 40px;
            text-align: center;
        }
        h1 {
            font-size: 3em;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2em;
        }
        .card {
            background: #fff;
            border-radius: 10px;
            padding: 20px;
            margin: 20px auto;
            max-width: 500px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        footer {
            background: rgba(0,0,0,0.7);
            color: #fff;
            text-align: center;
            padding: 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>Привіт, Надія!</h1>
        <p>Ласкаво просимо на мій гарний сайт</p>
    </header>
    <nav>
        <a href="#">Головна</a>
        <a href="#">Про нас</a>
        <a href="#">Контакти</a>
    </nav>
    <main>
        <div class="card">
            <h2>Це приклад картки</h2>
            <p>Тут можна розмістити будь-який текст, фото чи інформацію.</p>
        </div>
    </main>
    <footer>
        &copy; 2026 Мій сайт
    </footer>
</body>
</html>
